<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<title>MiniToo Live Studio</title>
<style>

  :root {
    --ui-font: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    --device-font: Menlo, Consolas, "DejaVu Sans Mono", monospace;
    --ink: #ededed;
    --ink-muted: #9a9a9a;
  }
  * { box-sizing: border-box; }
  body {
    background: #111; color: var(--ink); font-family: var(--ui-font);
    font-size: clamp(17px, 0.5vw + 14px, 20px); line-height: 1.5;
    padding: 36px 26px 44px; max-width: 600px; margin: auto;
    text-align: left;
  }

  h1 { font-size: 1.5em; font-weight: 600; letter-spacing: -0.01em; line-height: 1.25; margin: 0 0 8px; }
  .field-label { font-size: 1em; font-weight: 600; color: var(--ink); margin: 0 0 10px; }
  .section { margin-top: 28px; }

  .editor { position: relative; }
  .editor textarea,
  .editor .mirror {
    width: 100%; height: 104px;
    font-family: var(--device-font);
    font-size: 1.05em; line-height: 1.55;
    padding: 14px 16px; border: 1px solid #333; border-radius: 10px;
    white-space: pre-wrap; overflow-wrap: break-word; word-break: break-word;
    margin: 0;
  }
  .editor textarea {
    position: relative; z-index: 1;
    background: transparent; color: transparent; caret-color: #fff;
    resize: none; display: block;
  }
  .editor textarea:focus { outline: none; border-color: #3CC9A4; }
  .editor textarea::placeholder { color: #6a6a6a; }
  .editor textarea::selection { background: rgba(0,187,180,0.35); }
  .editor .mirror {
    position: absolute; inset: 0; z-index: 0;
    background: #1a1a1a; border-color: transparent;
    overflow: hidden; pointer-events: none; color: #fff;
  }
  .swatches { display: flex; gap: 12px; flex-wrap: wrap; }
  .swatch { width: 38px; height: 38px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; box-shadow: 0 0 0 1px rgba(255,255,255,0.08); }
  .swatch.selected { border-color: #fff; }
  button {
    padding: 11px 26px; font-family: var(--ui-font); font-size: 1em;
    border-radius: 8px; border: none; background: #3CC9A4; color: #000;
    font-weight: 600; cursor: pointer;
  }
  button:hover { background: #5BD6B6; }
  .status { font-size: 0.9em; color: var(--ink-muted); margin-top: 14px; min-height: 20px; }

  .line-dots { display: flex; justify-content: flex-end; align-items: center; gap: 5px; margin: 12px 0 0; }
  .line-dots .dot { width: 7px; height: 7px; border-radius: 50%; background: #333; transition: background 0.15s; }
  .line-dots .dot.filled { background: #3CC9A4; }
  .line-dots.full .dot.filled { background: #F7B8A0; }
  .line-dots .label { font-size: 0.8em; color: #F7B8A0; margin-right: 2px; }


  .conn-banner { display: none; padding: 16px 18px; border-radius: 10px; margin: 16px 0 0; font-size: 1em; font-weight: 600; line-height: 1.35; }
  .conn-banner.off { display: block; background: #2a1512; color: #F7B8A0; border: 1px solid #82352A; }
  .conn-banner .sub { display: block; font-size: 0.9em; font-weight: 400; color: #d99; margin-top: 6px; }
  .conn-on-line { font-size: 0.9em; color: #3CC9A4; margin: 0; }

  .minitoo-wrap.dimmed { max-width: 150px; opacity: 0.35; filter: grayscale(1); pointer-events: none; }


  .minitoo-wrap { margin-top: 40px; max-width: 260px; margin-left: auto; margin-right: auto; }
  .minitoo-head {
    background: linear-gradient(180deg, #f2ecd9 0%, #ded5bd 100%);
    border-radius: 16px;
    padding: 9px 9px 10px;
    box-shadow:
      0 10px 18px rgba(0,0,0,0.35),
      inset 0 1px 0 rgba(255,255,255,0.6),
      inset 0 -6px 10px rgba(0,0,0,0.12);
    position: relative;
    z-index: 2;
  }
  .minitoo-vents {
    height: 7px;
    margin: -2px -2px 8px;
    background: repeating-linear-gradient(100deg, #cbc2a8 0 3px, #a89d80 3px 4px, transparent 4px 10px);
    border-radius: 6px 6px 0 0;
    box-shadow: inset 0 2px 3px rgba(0,0,0,0.25);
  }
  .minitoo-bezel {
    background: linear-gradient(160deg, #efe8d4, #cfc6ac);
    border-radius: 14px;
    padding: 17px 16px;
    box-shadow:
      inset 0 2px 4px rgba(255,255,255,0.5),
      inset 0 -4px 8px rgba(0,0,0,0.15);
  }
  .minitoo-screen {
    background: radial-gradient(ellipse at 50% 40%, #161616 0%, #000 80%);
    border-radius: 8px;
    aspect-ratio: 4 / 3;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    overflow: hidden;
    box-shadow:
      inset 0 6px 14px rgba(0,0,0,0.85),
      inset 0 -2px 4px rgba(255,255,255,0.05);
  }
  .minitoo-screen-text {
    font-family: var(--device-font);
    font-weight: 600;
    font-size: 12px;
    line-height: 1.6;
    text-align: center;
    word-break: break-word;
  }
  .minitoo-badges {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    padding: 0 2px;
  }
  .minitoo-badges span:first-child {
    font-size: 11px; font-weight: 600; color: #555; letter-spacing: 0.05em;
    background: #dcd3ba; padding: 4px 10px; border-radius: 4px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), inset 0 -1px 1px rgba(0,0,0,0.15);
  }
  .minitoo-badges span:last-child {
    font-size: 10px; font-weight: 600; color: #fff;
    background: linear-gradient(180deg, #F7B8A0, #E8A58B);
    padding: 4px 12px; border-radius: 5px;
    box-shadow: 0 2px 3px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.3);
  }

  .minitoo-hinge {
    height: 6px;
    margin: -2px 14px 0;
    background: linear-gradient(180deg, #a89d80, #8d836a);
    border-radius: 0 0 4px 4px;
    box-shadow: 0 2px 3px rgba(0,0,0,0.25), inset 0 2px 3px rgba(0,0,0,0.35);
    position: relative;
    z-index: 1;
  }
  .minitoo-keyboard {
    margin-top: -3px;
    position: relative;
    z-index: 0;
  }

  .minitoo-deck {
    clip-path: polygon(0% 0%, 100% 0%, 90% 100%, 10% 100%);
    background: linear-gradient(180deg, #efe8d4, #d8cfb5);
    padding: 16px 28px 24px;
    box-shadow:
      0 10px 16px rgba(0,0,0,0.3),
      inset 0 2px 3px rgba(255,255,255,0.5),
      inset 0 -3px 5px rgba(0,0,0,0.12);
  }

  .minitoo-front {
    height: 8px;
    margin: 0 26px 9px;
    clip-path: polygon(0% 0%, 100% 0%, 88% 100%, 12% 100%);
    background: linear-gradient(180deg, #b7ad90, #968c6e);
  }
  .minitoo-panel {
    display: grid;
    grid-template-columns: repeat(3, 1fr) 30px;
    grid-template-rows: repeat(2, 20px);
    gap: 4px;
  }
  .minitoo-btn {
    border-radius: 6px;
    background: linear-gradient(180deg, #f6f1e2, #d9d0b6);
    box-shadow: 0 2px 2px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.8), inset 0 -2px 2px rgba(0,0,0,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    font-weight: 600;
    color: #82352A;
  }
  .minitoo-btn.power {
    background: linear-gradient(180deg, #F7B8A0, #E8A58B);
    color: #fff;
    box-shadow: 0 2px 2px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.4);
  }
  .minitoo-dial {
    grid-column: 4;
    grid-row: 1 / span 2;
    width: 100%;
    aspect-ratio: 1 / 1;
    align-self: center;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #d8cfb5 55%, #b7ad90 100%);
    box-shadow: 0 3px 5px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.6);
    position: relative;
  }
  .minitoo-dial::after {
    content: "";
    position: absolute;
    inset: 22%;
    border-radius: 50%;
    background: linear-gradient(180deg, #F7B8A0, #E8A58B);
    box-shadow: inset 0 1px 2px rgba(255,255,255,0.5), inset 0 -2px 3px rgba(0,0,0,0.25);
  }
  #login-form input { width:100%; padding:12px; margin-bottom:12px; font:inherit; background:#1a1a1a; color:var(--ink); border:1px solid #333; border-radius:10px; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<form id="login-form" class="section">
    <p class="field-label">Sign in to your display</p>
    <input id="email" type="email" placeholder="Email" autocomplete="username" required aria-label="Email">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" required aria-label="Password">
    <button type="submit">Sign in</button>
  </form>
  <button id="sign-out" hidden>Sign out</button>
  <h1>MiniToo Live Studio</h1>
  <div class="conn-banner" id="conn-banner"></div>
  <div class="conn-on-line" id="conn-on-line" style="display:none;">● Ready to receive a message</div>

  <div class="section">
    <p class="field-label">Your name <span style="font-weight:400; color:var(--ink-muted);">(optional — kept in the submission log only)</span></p>
    <input type="text" id="name" maxlength="14" placeholder=""
      style="width:100%; font-family:var(--ui-font); font-size:1em; padding:11px 14px;
      border:1px solid #333; border-radius:10px; background:#1a1a1a; color:#fff;">
  </div>

  <div class="section">
    <p class="field-label">Your message</p>
    <div class="editor">
      <div class="mirror" id="mirror" aria-hidden="true"></div>
      <textarea id="text" placeholder="Type a message for the display..." maxlength="300"></textarea>
    </div>
    <div class="line-dots" id="line-dots"></div>
  </div>

  <div class="section">
    <p class="field-label">Pick your color(s)</p>
    <div class="swatches" id="swatches"></div>
  </div>

  <div class="section">
    <button id="send">Send message</button>
    <div class="status" id="status"></div>
  </div>

  <div class="minitoo-wrap" id="minitoo-wrap">
    <div class="minitoo-head">
      <div class="minitoo-vents"></div>
      <div class="minitoo-bezel">
        <div class="minitoo-screen">
          <div class="minitoo-screen-text" id="preview-text">send a message</div>
        </div>
      </div>
      <div class="minitoo-badges">
        <span>MINITOO</span>
        <span>Divoom</span>
      </div>
    </div>
    <div class="minitoo-hinge"></div>
    <div class="minitoo-keyboard">
      <div class="minitoo-deck">
        <div class="minitoo-panel">
          <div class="minitoo-btn power">⏻</div>
          <div class="minitoo-btn">MODE</div>
          <div class="minitoo-btn">↩</div>
          <div class="minitoo-btn">–</div>
          <div class="minitoo-btn">⏵⏸</div>
          <div class="minitoo-btn">+</div>
          <div class="minitoo-dial"></div>
        </div>
      </div>
      <div class="minitoo-front"></div>
    </div>
  </div>

  <div style="text-align:center; margin-top:10px;">
    <a href="log.html" style="font-size:0.85em; color:#444; text-decoration:none;">Submission log</a>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

import { FIREBASE_CONFIG } from "./config.js";

const app = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
const db = getDatabase(app);

const COLORS = ["#E2F6EF", "#3CC9A4", "#F7B8A0"];

const chars = (s) => Array.from(s);

function isEmojiChar(ch) {
  const cp = ch.codePointAt(0);
  return (
    (cp >= 0x1F000 && cp <= 0x1FFFF) ||
    (cp >= 0x2600 && cp <= 0x27BF) ||
    (cp >= 0x2B00 && cp <= 0x2BFF) ||
    cp === 0x2764 || cp === 0x2660 || cp === 0x2663 || cp === 0x2665 || cp === 0x2666 ||
    cp === 0xFE0F || cp === 0x200D
  );
}

let currentColor = COLORS[0];
let charColors = [];
let prevChars = [];

const swatchesEl = document.getElementById("swatches");
COLORS.forEach(c => {
  const el = document.createElement("div");
  el.title = ({"#E2F6EF":"Mint Mist", "#3CC9A4":"Seafoam", "#F7B8A0":"Apricot"})[c];
  el.setAttribute("aria-label", el.title);
  el.className = "swatch" + (c === currentColor ? " selected" : "");
  el.style.background = c;
  el.onclick = () => {
    currentColor = c;
    [...swatchesEl.children].forEach(s => s.classList.remove("selected"));
    el.classList.add("selected");
  };
  swatchesEl.appendChild(el);
});

const statusEl = document.getElementById("status");
const textEl = document.getElementById("text");
const nameEl = document.getElementById("name");
const previewTextEl = document.getElementById("preview-text");

function syncCharColors() {
  const newChars = chars(textEl.value);
  let i = 0;
  while (i < prevChars.length && i < newChars.length && prevChars[i] === newChars[i]) i++;
  let j = 0;
  while (
    j < prevChars.length - i &&
    j < newChars.length - i &&
    prevChars[prevChars.length - 1 - j] === newChars[newChars.length - 1 - j]
  ) j++;
  const removed = prevChars.length - i - j;
  const insertedLen = newChars.length - i - j;
  const inserted = new Array(insertedLen).fill(currentColor);
  charColors.splice(i, removed, ...inserted);
  prevChars = newChars;
}

const mirrorEl = document.getElementById("mirror");
function renderMirror() {
  mirrorEl.innerHTML = "";
  for (const run of buildRuns()) {
    const span = document.createElement("span");
    span.style.color = run.color;
    span.textContent = run.text;
    mirrorEl.appendChild(span);
  }
  mirrorEl.appendChild(document.createTextNode("\n"));
  mirrorEl.scrollTop = textEl.scrollTop;
}

function buildRuns() {
  const cs = chars(textEl.value);
  const runs = [];
  let curColor = null, curText = "";
  for (let k = 0; k < cs.length; k++) {
    const c = charColors[k] || currentColor;
    if (c === curColor) {
      curText += cs[k];
    } else {
      if (curText) runs.push({ text: curText, color: curColor });
      curColor = c;
      curText = cs[k];
    }
  }
  if (curText) runs.push({ text: curText, color: curColor });
  return runs;
}

const DEVICE_WIDTH = 160, DEVICE_HEIGHT = 128, DEVICE_MARGIN = 14, DEVICE_VMARGIN = 4, DEVICE_LINE_H = 22;
const MAX_DEVICE_LINES = Math.max(1, Math.floor((DEVICE_HEIGHT - 2 * DEVICE_VMARGIN) / DEVICE_LINE_H));
const measureCanvas = document.createElement("canvas");
const mctx = measureCanvas.getContext("2d");

function measureMixed(csArr) {
  let width = 0, i = 0;
  while (i < csArr.length) {
    const emoji = isEmojiChar(csArr[i]);
    let seg = csArr[i]; i++;
    while (i < csArr.length && isEmojiChar(csArr[i]) === emoji) { seg += csArr[i]; i++; }
    mctx.font = emoji ? "20px Menlo, monospace" : "18px Menlo, monospace";
    width += mctx.measureText(seg).width;
  }
  return width;
}

function breakWideWords(words) {
  const maxW = DEVICE_WIDTH - 2 * DEVICE_MARGIN;
  const out = [];
  for (const word of words) {
    if (measureMixed(word) <= maxW) { out.push(word); continue; }
    let chunk = [];
    for (const ch of word) {
      const trial = [...chunk, ch];
      if (chunk.length && measureMixed(trial) > maxW) { out.push(chunk); chunk = [ch]; }
      else chunk = trial;
    }
    if (chunk.length) out.push(chunk);
  }
  return out;
}

function wrapLineCount(cs) {
  let words = [];
  let cur = [];
  for (const ch of cs) {
    if (/\s/.test(ch)) { if (cur.length) { words.push(cur); cur = []; } }
    else cur.push(ch);
  }
  if (cur.length) words.push(cur);
  if (!words.length) return 1;
  words = breakWideWords(words);
  let lines = 1, curLineChars = [];
  for (const word of words) {
    const trial = curLineChars.length ? [...curLineChars, " ", ...word] : word;
    if (measureMixed(trial) > DEVICE_WIDTH - 2 * DEVICE_MARGIN && curLineChars.length) {
      lines++;
      curLineChars = word;
    } else {
      curLineChars = trial;
    }
  }
  return lines;
}

function trimToFit(csArr) {
  if (wrapLineCount(csArr) <= MAX_DEVICE_LINES) return csArr.slice();
  let lo = 0, hi = csArr.length; // lo always fits, hi never does
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    if (wrapLineCount(csArr.slice(0, mid)) <= MAX_DEVICE_LINES) lo = mid;
    else hi = mid;
  }
  return csArr.slice(0, lo);
}

function computeDeviceLines(runs) {
  const cs = [];
  const charColors = [];
  for (const r of runs) for (const ch of chars(r.text)) { cs.push(ch); charColors.push(r.color); }
  const defaultColor = runs[0] ? runs[0].color : "#fff";

  let words = [];
  let cur = [], curStart = -1;
  for (let k = 0; k < cs.length; k++) {
    if (/\s/.test(cs[k])) {
      if (cur.length) { words.push({ chars: cur, start: curStart }); cur = []; curStart = -1; }
    } else {
      if (curStart === -1) curStart = k;
      cur.push(cs[k]);
    }
  }
  if (cur.length) words.push({ chars: cur, start: curStart });

  {
    const maxW = DEVICE_WIDTH - 2 * DEVICE_MARGIN;
    const split = [];
    for (const word of words) {
      if (measureMixed(word.chars) <= maxW) { split.push(word); continue; }
      let chunk = [], chunkStart = word.start;
      for (let k = 0; k < word.chars.length; k++) {
        const trial = [...chunk, word.chars[k]];
        if (chunk.length && measureMixed(trial) > maxW) {
          split.push({ chars: chunk, start: chunkStart });
          chunk = [word.chars[k]];
          chunkStart = word.start + k;
        } else {
          chunk = trial;
        }
      }
      if (chunk.length) split.push({ chars: chunk, start: chunkStart });
    }
    words = split;
  }

  const lineChars = (line) => {
    const out = [];
    line.forEach((word, i) => { if (i > 0) out.push(" "); out.push(...word.chars); });
    return out;
  };

  let lines = [], curLine = [], curLineChars = [];
  for (const word of words) {
    const trial = curLineChars.length ? [...curLineChars, " ", ...word.chars] : word.chars;
    if (measureMixed(trial) > DEVICE_WIDTH - 2 * DEVICE_MARGIN && curLine.length) {
      lines.push(curLine);
      curLine = [word]; curLineChars = word.chars;
    } else {
      curLine.push(word); curLineChars = trial;
    }
  }
  if (curLine.length) lines.push(curLine);
  if (!lines.length) lines = [[]];

  const maxLines = Math.max(1, Math.floor((DEVICE_HEIGHT - 2 * DEVICE_VMARGIN) / DEVICE_LINE_H));
  if (lines.length > maxLines) {
    lines = lines.slice(0, maxLines);
    const lastLine = lines[lines.length - 1];
    const fits = () => measureMixed([...lineChars(lastLine), "…"]) <= DEVICE_WIDTH - 2 * DEVICE_MARGIN;
    while (lastLine.length && !fits()) {
      const lastWord = lastLine[lastLine.length - 1];
      lastWord.chars.pop();
      if (!lastWord.chars.length) lastLine.pop();
    }
    const lastWord = lastLine[lastLine.length - 1];
    const ellipsisColor = lastWord ? (charColors[lastWord.start + lastWord.chars.length - 1] || defaultColor) : defaultColor;
    lastLine.push({ chars: ["…"], start: -1, forcedColor: ellipsisColor });
  }

  return lines.map(line => {
    const lineRuns = [];
    let curColor = null, curText = "";
    const pushChar = (ch, color) => {
      if (color === curColor) curText += ch;
      else { if (curText) lineRuns.push({ text: curText, color: curColor }); curColor = color; curText = ch; }
    };
    for (let wi = 0; wi < line.length; wi++) {
      if (wi > 0) pushChar(" ", curColor || defaultColor);
      const word = line[wi];
      for (let k = 0; k < word.chars.length; k++) {
        const ch = word.chars[k];
        const color = word.start === -1 ? word.forcedColor : (charColors[word.start + k] || defaultColor);
        pushChar(ch, color);
      }
    }
    if (curText) lineRuns.push({ text: curText, color: curColor });
    return lineRuns;
  });
}

function renderPreview(runs) {
  previewTextEl.innerHTML = "";
  const deviceLines = computeDeviceLines(runs);
  deviceLines.forEach((lineRuns, i) => {
    if (i > 0) previewTextEl.appendChild(document.createElement("br"));
    for (const run of lineRuns) {
      const span = document.createElement("span");
      span.style.color = run.color;
      span.textContent = run.text;
      previewTextEl.appendChild(span);
    }
  });
}

const dotsEl = document.getElementById("line-dots");
for (let i = 0; i < MAX_DEVICE_LINES; i++) {
  const dot = document.createElement("div");
  dot.className = "dot";
  dotsEl.appendChild(dot);
}
const labelEl = document.createElement("span");
labelEl.className = "label";
labelEl.textContent = "full";
labelEl.style.display = "none";
dotsEl.insertBefore(labelEl, dotsEl.firstChild);

function updateTicker() {
  const lineCount = wrapLineCount(chars(textEl.value));
  const full = lineCount >= MAX_DEVICE_LINES;
  const dots = dotsEl.querySelectorAll(".dot");
  dots.forEach((dot, i) => dot.classList.toggle("filled", i < lineCount));
  dotsEl.classList.toggle("full", full);
  if (full) {
    const cs = chars(textEl.value);
    let n = 0;
    while (n < 40 && wrapLineCount([...cs, ...Array(n + 1).fill("x")]) <= MAX_DEVICE_LINES) n++;
    labelEl.textContent = n === 0 ? "full" : (n >= 40 ? "40+ left" : n + " left");
  }
  labelEl.style.display = full ? "inline" : "none";
}

textEl.addEventListener("input", () => {
  const cs = chars(textEl.value);
  const fitted = trimToFit(cs);
  if (fitted.length !== cs.length) {
    textEl.value = fitted.join("");
    textEl.selectionStart = textEl.selectionEnd = textEl.value.length;
  }
  syncCharColors();
  updateTicker();
  renderMirror();
});
textEl.addEventListener("scroll", () => { mirrorEl.scrollTop = textEl.scrollTop; });
updateTicker();
renderMirror();

const sendButton = document.getElementById("send");
sendButton.disabled = true;
document.getElementById("login-form").onsubmit = async (event) => {
  event.preventDefault();
  try {
    await signInWithEmailAndPassword(auth, document.getElementById("email").value, document.getElementById("password").value);
    document.getElementById("password").value = "";
  } catch {
    statusEl.textContent = "Couldn't sign in. Check your email and password.";
  }
};
document.getElementById("sign-out").onclick = () => signOut(auth);
onAuthStateChanged(auth, (user) => {
  sendButton.disabled = !user;
  document.getElementById("login-form").hidden = !!user;
  document.getElementById("sign-out").hidden = !user;
  if (!user) statusEl.textContent = "Sign in to send a message.";
});

const HEARTBEAT_STALE_MS = 5000;
const bannerEl = document.getElementById("conn-banner");
const onLineEl = document.getElementById("conn-on-line");
const wrapEl = document.getElementById("minitoo-wrap");
let latestStatus = null;

function isOnline() {
  if (latestStatus && latestStatus.backend_off) return false;
  return !!(latestStatus && latestStatus.heartbeat && (Date.now() - latestStatus.heartbeat) < HEARTBEAT_STALE_MS);
}

let hasSentMessage = false;
function updateScreenPlaceholder() {
  if (hasSentMessage) return;
  previewTextEl.textContent = isOnline() ? "send a message" : "try again later";
}

function updateConnBadge() {
  updateScreenPlaceholder();
  if (isOnline()) {
    bannerEl.className = "conn-banner";
    onLineEl.style.display = "block";
    wrapEl.classList.remove("dimmed");
  } else {
    bannerEl.className = "conn-banner off";
    bannerEl.innerHTML = 'Live Studio is turned off right now<span class="sub">Ask the display owner to turn it back on, then reload this page.</span>';
    onLineEl.style.display = "none";
    wrapEl.classList.add("dimmed");
  }
}

let stopStatus;
onAuthStateChanged(auth, (user) => {
  if (stopStatus) stopStatus();
  latestStatus = null;
  updateConnBadge();
  if (user) stopStatus = onValue(ref(db, "minitoo-status"), (snap) => {
    latestStatus = snap.val(); updateConnBadge();
  }, () => { statusEl.textContent = "This account does not have access to the display."; });
});
setInterval(updateConnBadge, 1000); // heartbeat can go stale between snapshots

let logWriteError = null;

document.getElementById("send").onclick = () => {
  logWriteError = null;
  if (!auth.currentUser) { statusEl.textContent = "Sign in first."; return; }
  if (!isOnline()) {
    statusEl.textContent = "Can't send — Live Studio is off right now.";
    statusEl.style.color = "#F7B8A0";
    return;
  }
  statusEl.style.color = "#888";
  statusEl.textContent = "sending...";
  const sentRuns = buildRuns();
  const sentTs = Date.now();
  set(ref(db, "minitoo-live"), {
    text: textEl.value,
    color: sentRuns[0] ? sentRuns[0].color : currentColor,
    runs: sentRuns,
    name: nameEl.value.trim(),
    ts: sentTs,
  }).then(() => {
    push(ref(db, "minitoo-log"), {
      text: textEl.value,
      runs: sentRuns,
      name: nameEl.value.trim(),
      ts: sentTs,
    }).catch((err) => {
      logWriteError = err && err.message ? err.message : String(err);
    });
    hasSentMessage = true;
    renderPreview(sentRuns);
    waitForAck(sentTs);
  }).catch(() => {
    statusEl.textContent = "Couldn't send that. Check your connection and try again.";
    statusEl.style.color = "#F7B8A0";
  });
};

function waitForAck(sentTs) {
  statusEl.textContent = "Sending to the display...";
  const statusRef = ref(db, "minitoo-status/last_result");
  let done = false;
  let timer;
  let unsubscribe;
  unsubscribe = onValue(statusRef, (snap) => {
    if (done) return;
    const r = snap.val();
    if (r && r.for_ts === sentTs) {
      done = true;
      clearTimeout(timer);
      unsubscribe();
      if (r.ok) {
        statusEl.textContent = logWriteError
          ? `Transfer acknowledged. (log not saved: ${logWriteError})`
          : "Transfer acknowledged.";
        statusEl.style.color = logWriteError ? "#F7B8A0" : "#3CC9A4";
      } else {
        statusEl.textContent = "Sent, but the display didn't get it. Live Studio may have just gone offline.";
        statusEl.style.color = "#F7B8A0";
      }
    }
  });
  timer = setTimeout(() => {
    if (done) return;
    done = true;
    unsubscribe();
    statusEl.textContent = "Sent, but no confirmation came back — Live Studio may have gone offline.";
    statusEl.style.color = "#F7B8A0";
  }, 30000);
}
</script>
</body>
</html>
